<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>30X · Documento</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#000;--card:#0B0B0B;--card2:#111;--lime:#E9FF7B;--w:#fff;--mut:#8C8C8C;--dim:#5A5A5A;--ink:#0A0A0A;
--l10:rgba(255,255,255,.10);--l14:rgba(255,255,255,.14);--l18:rgba(255,255,255,.18);--lime40:rgba(233,255,123,.40);
--f:"Inter",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.22,1,.36,1);--px:96px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--w);font-family:var(--f);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{width:1920px;height:1080px;position:relative;flex:none;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--bg);display:none;overflow:hidden}
.slide.active{display:block}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:48px 48px;
-webkit-mask-image:radial-gradient(ellipse 80% 70% at 70% 40%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 80% 70% at 70% 40%,#000 0%,transparent 75%)}
.top{position:absolute;top:58px;left:var(--px);right:var(--px);display:flex;justify-content:space-between;align-items:center;z-index:2}
.kicker{font-weight:600;font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:var(--lime)}
.brand{height:30px;width:87px;fill:var(--w);opacity:.9}
.body{position:absolute;top:140px;left:var(--px);right:var(--px);bottom:130px;z-index:1}
h1{font-weight:600;font-size:84px;line-height:1.02;letter-spacing:-.045em;text-wrap:balance}
h1.m{font-size:68px;letter-spacing:-.04em} h1.s{font-size:54px;letter-spacing:-.035em;line-height:1.06}
h1.cv{font-size:112px;letter-spacing:-.05em;line-height:.98}
.l{color:var(--lime)}
.lead{font-size:32px;line-height:1.4;color:var(--mut);margin-top:24px;max-width:1300px;text-wrap:pretty}
.rule{width:220px;height:3px;background:var(--lime);margin-top:44px}
.whoc{font-size:28px;font-weight:600;margin-top:40px}.whoc span{display:block;font-weight:400;color:var(--mut);font-size:24px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--l10);border-radius:22px;padding:34px 36px;position:relative}
.card.key{border-color:var(--lime40)} .card.lime{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.card .n{font-weight:600;font-size:20px;letter-spacing:.06em;color:var(--lime);text-transform:uppercase}
.card.lime .n{color:var(--ink);opacity:.6}
.card .t{font-weight:600;font-size:34px;line-height:1.1;letter-spacing:-.03em;margin-top:10px}
.card .d,.d{font-size:24px;line-height:1.42;color:var(--mut);margin-top:10px}
.card.lime .d{color:var(--ink);opacity:.75}
.grid{display:grid;gap:24px}
.v{width:100%;display:block;background:#000;border-radius:18px;border:1px solid var(--l14);object-fit:contain}
.card .v{border-radius:0;border:0;border-bottom:1px solid var(--l10)}
.mt{font-weight:600;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.desc{font-size:30px;line-height:1.42;color:#D9D9D9;margin-top:26px;text-wrap:pretty}
.qt{font-size:28px;line-height:1.35;color:var(--w);margin-top:24px;padding-left:22px;border-left:3px solid var(--lime);font-weight:500}
.qt.sm{font-size:22px;margin-top:14px;padding-left:16px}
.who2{font-size:20px;color:var(--dim);margin-top:26px}.who2 b{color:var(--mut);font-weight:600}
.bt{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.b{font:600 18px/1 var(--f);text-decoration:none;background:var(--lime);color:var(--ink);border-radius:999px;padding:13px 20px;border:1px solid var(--lime)}
.b.o{background:transparent;color:var(--w);border-color:var(--l18)} .b:hover{opacity:.85} .b.o:hover{border-color:var(--lime);color:var(--lime);opacity:1}
.tline{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:56px}
.tline div{border-top:2px solid var(--lime);padding-top:14px}.tline b{display:block;font-size:24px;font-weight:600}.tline span{font-size:20px;color:var(--mut);line-height:1.35;display:block;margin-top:4px}
.tl2{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 28px;margin-top:46px}
.tl2 div{border-top:2px solid var(--l18);padding-top:16px}.tl2 div:last-child{border-color:var(--lime)}
.tl2 b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em}.tl2 .mt{display:block;margin-top:6px;font-size:16px}
.tl2 p{font-size:23px;line-height:1.42;color:#D0D0D0;margin-top:10px}
.chain{display:flex;align-items:stretch;gap:10px;margin-top:40px}
.nd{flex:1;background:var(--card);border:1px solid var(--l10);border-radius:18px;padding:20px 20px 22px}
.nd:last-child{border-color:var(--lime40)} .nd .k{font-weight:600;font-size:16px;color:var(--lime)}
.nd b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:8px} .nd span{display:block;font-size:17px;color:var(--mut);margin-top:2px}
.nd p{font-size:19px;line-height:1.35;color:#D0D0D0;margin-top:12px}
.ar{display:flex;align-items:center;color:var(--lime);font-size:30px}
.msgs{display:flex;flex-direction:column;gap:8px;overflow:hidden}
.msg{background:var(--card2);border:1px solid var(--l14);border-radius:14px;padding:10px 16px;max-width:94%}
.msg.me{align-self:flex-end;border-color:var(--lime40);background:#11130A}
.msg .mh{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)} .msg .mh b{color:var(--lime)}
.msg .mb{font-size:19px;line-height:1.32;margin-top:4px;color:#EDEDED}
.rail{position:absolute;left:var(--px);right:var(--px);bottom:44px;display:flex;gap:10px;z-index:3;align-items:flex-end}
.rail .sg{flex:1;border-top:2px solid var(--l14);padding-top:12px;font-size:19px;font-weight:500;color:var(--dim);white-space:nowrap;cursor:pointer}
.rail .sg.done{border-color:var(--l18);color:var(--mut)} .rail .sg.on{border-color:var(--lime);color:var(--w);font-weight:600}
.rail .pg{flex:none;width:160px;text-align:right;font-size:19px;color:var(--mut);padding-top:14px}.rail .pg b{color:var(--w)}
.st{opacity:0;transform:translateY(18px)}
.slide.active .st{animation:up .7s var(--ease) forwards;animation-delay:calc(var(--i,0)*90ms + 80ms)}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.active .st{animation:none;opacity:1;transform:none}}
#hint{position:fixed;right:18px;bottom:14px;font-size:12px;color:#555;z-index:9}
#nav{position:fixed;inset:auto 0 0 0;height:0}
html.print,html.print body{overflow:visible;height:auto}
html.print #stage{position:static;display:block} html.print #deck{transform:none!important}
html.print .slide{display:block;position:relative;width:1920px;height:1080px;page-break-after:always;break-after:page}
html.print .st{opacity:1;transform:none;animation:none!important} html.print #hint{display:none}
@page{size:1920px 1080px;margin:0}
</style></head><body><div id="app"></div>

#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:50;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#gate h1{font-size:34px;line-height:1.08;letter-spacing:-.03em;font-weight:600;margin:0}
#gate p{color:#8C8C8C;margin:0;font-size:15px;line-height:1.5}
#gate input{font:500 17px Inter,system-ui,sans-serif;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#0B0B0B;color:#fff;outline:none}
